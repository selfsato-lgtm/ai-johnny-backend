<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AIジョニー</title>
<style>
:root{
  --bg:#0D0D1A; --card:#1A1A35; --card2:#12122A;
  --gold:#F5A623; --red:#E94560; --blue:#4A9EDB;
  --green:#4CAF73; --purple:#7B5EA7;
  --white:#FFFFFF; --light:#E0E0E0; --muted:#8888AA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Yu Gothic UI','Hiragino Sans','Meiryo',sans-serif;
  background:var(--bg);color:var(--light)}

.app{min-height:100vh}

.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid #2a2a4a;background:linear-gradient(135deg,#0D0D1A 0%,#1A0D2E 100%);
  position:sticky;top:0;z-index:60}
.hamburger{font-size:20px;cursor:pointer;color:var(--light);background:none;border:none;padding:4px;line-height:1}
.portal-back{flex-shrink:0;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);
  border:1px solid #3a3a5a;border-radius:20px;padding:7px 14px;
  font-size:11.5px;color:var(--light);text-decoration:none}
.portal-back:hover{border-color:var(--gold);color:var(--gold)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--purple);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.titles{min-width:0}
.t-title{font-size:14.5px;font-weight:900;color:var(--white);white-space:nowrap}
.t-sub{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0}
.new-chat-btn{margin-left:auto;font-size:11px;padding:6px 12px;border-radius:14px;
  border:1px solid #444;background:transparent;color:var(--muted);cursor:pointer}
.new-chat-btn:hover{border-color:var(--gold);color:var(--gold)}

.layout{display:flex;align-items:flex-start}

.sidebar{width:150px;flex-shrink:0;border-right:1px solid #2a2a4a;background:var(--card2);
  padding:10px 6px;transition:margin-left .2s;
  position:sticky;top:57px;max-height:calc(100vh - 57px);overflow-y:auto}
.sidebar.collapsed{margin-left:-156px}
.sidebar-label{font-size:10px;color:var(--muted);padding:4px 8px;margin-bottom:4px;letter-spacing:.5px}
.history-item{font-size:11px;padding:8px;border-radius:8px;color:var(--muted);
  margin-bottom:3px;cursor:default}
.history-empty{font-size:10.5px;color:var(--muted);padding:8px;line-height:1.6;text-align:center}
.history-item{font-size:11px;padding:8px;border-radius:8px;color:var(--light);
  margin-bottom:3px;cursor:pointer;background:var(--card);border:1px solid transparent}
.history-item:hover{border-color:var(--gold)}
.history-item .hi-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.history-item .hi-time{font-size:9.5px;color:var(--muted);margin-top:2px}

.main{flex:1;min-width:0;padding:20px 16px}
.main-inner{max-width:620px;margin:0 auto}

.welcome{text-align:center;margin-bottom:20px}
.welcome .w-icon{font-size:44px}
.welcome .w-title{font-size:16px;font-weight:900;color:var(--white);margin-top:6px}
.welcome .w-sub{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6}

.demo-badge{display:inline-block;background:#2A0D1A;border:1px solid var(--red);color:var(--red);
  font-size:10.5px;padding:4px 12px;border-radius:12px;margin-bottom:14px}

/* drop zone */
.dropzone{background:var(--card);border:2px dashed #3a3a5a;border-radius:16px;
  padding:32px 20px;text-align:center;cursor:pointer;transition:.15s;margin-bottom:14px}
.dropzone.dragover{border-color:var(--gold);background:var(--card2)}
.dropzone .dz-icon{font-size:36px}
.dropzone .dz-text{font-size:13px;color:var(--light);margin-top:8px;font-weight:700}
.dropzone .dz-sub{font-size:11px;color:var(--muted);margin-top:4px}
#fileInput{display:none}

.file-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.file-chip{background:var(--card);border:1px solid var(--green);border-radius:10px;
  padding:8px 10px;font-size:11.5px;display:flex;align-items:center;gap:8px;max-width:200px}
.file-chip .fc-icon{font-size:18px;flex-shrink:0}
.file-chip .fc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.file-chip .fc-remove{cursor:pointer;color:var(--muted);flex-shrink:0;font-size:14px}
.file-chip .fc-remove:hover{color:var(--red)}
.file-chip img{width:32px;height:32px;object-fit:cover;border-radius:6px;flex-shrink:0}

.text-note{width:100%;background:var(--card2);border:1px solid #2a2a4a;border-radius:10px;
  padding:10px 12px;font-size:12.5px;color:var(--light);resize:vertical;min-height:60px;
  font-family:inherit;margin-bottom:14px}
.text-note::placeholder{color:var(--muted)}

.analyze-btn{display:block;width:100%;font-size:13.5px;padding:11px;border-radius:14px;
  border:none;background:var(--gold);color:var(--bg);font-weight:900;cursor:pointer;margin-bottom:20px}
.analyze-btn:disabled{opacity:.4;cursor:default}
.analyze-btn:hover:not(:disabled){filter:brightness(1.08)}

.chat-input-row{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:0;
  background:var(--bg);padding:10px 0}
.chat-input{flex:1;background:var(--card2);border:1px solid #2a2a4a;border-radius:20px;
  padding:10px 16px;font-size:13px;color:var(--light);font-family:inherit}
.chat-input::placeholder{color:var(--muted)}
.chat-input:focus{outline:none;border-color:var(--gold)}
.chat-send-btn{flex-shrink:0;font-size:13px;padding:10px 18px;border-radius:20px;
  border:none;background:var(--gold);color:var(--bg);font-weight:900;cursor:pointer}
.chat-send-btn:disabled{opacity:.4;cursor:default}
.chat-send-btn:hover:not(:disabled){filter:brightness(1.08)}

/* chat area */
.chat-log{display:flex;flex-direction:column;gap:14px}
.msg-user{align-self:flex-end;background:var(--card2);border-radius:14px 14px 4px 14px;
  padding:10px 14px;font-size:12.5px;max-width:80%}
.bubble{background:var(--card);border-radius:14px 14px 14px 4px;padding:14px;
  display:flex;gap:10px;align-items:flex-start;max-width:90%}
.bubble .b-avatar{width:30px;height:30px;border-radius:50%;background:var(--purple);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.bubble .b-body{flex:1;min-width:0;font-size:12.5px;line-height:1.85;color:var(--light)}
.bubble .b-body p{margin-bottom:9px}
.bubble .b-body .sec-h{color:var(--gold);font-weight:900;font-size:13px;margin:14px 0 6px}
.bubble .b-body p:first-child{margin-top:0}
.typing{display:flex;gap:4px;padding:6px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);
  animation:blink 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

.loading{text-align:center;color:var(--muted);font-size:13px;padding:60px 20px}

@media(max-width:600px){
  .sidebar{position:fixed;left:0;top:57px;bottom:0;z-index:50;box-shadow:2px 0 12px rgba(0,0,0,.4)}
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <a class="portal-back" href="https://selfsato-lgtm.github.io/love-quest/">← ポータルへ戻る</a>
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="avatar">🧠</div>
    <div class="titles">
      <div class="t-title">AIジョニー</div>
      <div class="t-sub"><span class="dot"></span>写真・動画・テキストからタイプを分析</div>
    </div>
    <button class="new-chat-btn" onclick="resetChat()">＋ 新規分析</button>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-label">分析履歴</div>
      <div id="historyList"></div>
    </div>

    <div class="main">
      <div class="main-inner">
        <div class="welcome">
          <div class="w-icon">🔮</div>
          <div class="w-title">AIジョニーへようこそ</div>
          <div class="w-sub">気になる相手の写真・動画・プロフィール文章をドラッグ&ドロップすると、<br>タイプ診断・相性・デートプランを分析します</div>
        </div>

        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
          <div class="dz-icon">📥</div>
          <div class="dz-text">写真・動画をドラッグ&ドロップ、またはタップして選択</div>
          <div class="dz-sub">対応形式: JPG / PNG / MP4 / MOV（複数選択可）</div>
          <input type="file" id="fileInput" multiple accept="image/*,video/*">
        </div>

        <div class="file-list" id="fileList"></div>

        <textarea class="text-note" id="textNote" placeholder="プロフィール文章や気になる発言があれば貼り付けてください（任意）"></textarea>

        <button class="analyze-btn" id="analyzeBtn" onclick="runAnalysis()" disabled>🔍 分析する</button>

        <div class="chat-log" id="chatLog"></div>

        <div class="chat-input-row" id="chatInputRow">
          <input type="text" class="chat-input" id="chatInput" placeholder="AIジョニーに質問する（写真がなくてもOK）...">
          <button class="chat-send-btn" id="chatSendBtn" onclick="sendChatMessage()">送信</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let uploadedFiles = [];
let conversation = []; // Anthropicのmessages形式の会話履歴
let history = []; // 過去の分析セッションの履歴 [{label, time}]
let currentSessionStarted = false; // 今の会話をすでに履歴に記録したか

function loadHistory(){
  try {
    const saved = JSON.parse(localStorage.getItem('aiJohnnyHistory') || '[]');
    if(Array.isArray(saved)) history = saved;
  } catch(e){ history = []; }
}
function saveHistory(){
  localStorage.setItem('aiJohnnyHistory', JSON.stringify(history.slice(0, 30)));
}
function renderHistory(){
  const list = document.getElementById('historyList');
  if(history.length === 0){
    list.innerHTML = '<div class="history-empty">まだ履歴はありません。<br>分析すると、ここに<br>記録されます。</div>';
    return;
  }
  list.innerHTML = history.map(h =>
    `<div class="history-item"><span class="hi-label">${escapeHtml(h.label)}</span><span class="hi-time">${escapeHtml(h.time)}</span></div>`
  ).join('');
}
function addHistoryEntry(label){
  const time = new Date().toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
  history.unshift({ label: label.slice(0, 40) || '（分析リクエスト）', time });
  saveHistory();
  renderHistory();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('collapsed');
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

['dragover'].forEach(evt => {
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
});
['dragleave','drop'].forEach(evt => {
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
  });
});
dropzone.addEventListener('drop', e => {
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
});

function handleFiles(fileListObj){
  Array.from(fileListObj).forEach(f => {
    uploadedFiles.push(f);
  });
  renderFileList();
  updateAnalyzeBtn();
}

function removeFile(idx){
  uploadedFiles.splice(idx, 1);
  renderFileList();
  updateAnalyzeBtn();
}

function renderFileList(){
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  uploadedFiles.forEach((f, idx) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    const isImage = f.type.startsWith('image/');
    const icon = isImage ? '' : (f.type.startsWith('video/') ? '🎬' : '📄');
    let thumbHtml = '';
    if(isImage && typeof URL !== 'undefined' && URL.createObjectURL){
      try {
        const url = URL.createObjectURL(f);
        thumbHtml = `<img src="${url}">`;
      } catch(e){}
    }
    chip.innerHTML = `${thumbHtml || `<span class="fc-icon">${icon || '📄'}</span>`}` +
      `<span class="fc-name">${escapeHtml(f.name)}</span>` +
      `<span class="fc-remove" data-idx="${idx}">✕</span>`;
    chip.querySelector('.fc-remove').onclick = () => removeFile(idx);
    list.appendChild(chip);
  });
}

function updateAnalyzeBtn(){
  const note = document.getElementById('textNote').value.trim();
  document.getElementById('analyzeBtn').disabled = (uploadedFiles.length === 0 && note === '');
}
document.getElementById('textNote').addEventListener('input', updateAnalyzeBtn);

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 動画からフレームを数枚切り出してJPEGのBase64にする
function extractVideoFrames(file, frameCount = 3){
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.preload = 'metadata';
    video.src = URL.createObjectURL(file);
    video.muted = true;
    const frames = [];
    video.onloadedmetadata = () => {
      const duration = video.duration;
      const times = Array.from({length: frameCount}, (_, i) => (duration * (i + 1)) / (frameCount + 1));
      let idx = 0;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const captureNext = () => {
        if(idx >= times.length){
          URL.revokeObjectURL(video.src);
          resolve(frames);
          return;
        }
        video.currentTime = times[idx];
      };
      video.onseeked = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        frames.push(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
        idx++;
        captureNext();
      };
      captureNext();
    };
    video.onerror = reject;
  });
}

// **bold** や `code` などインラインのMarkdown記法をHTMLに変換
function renderInline(s){
  let out = escapeHtml(s);
  out = out.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  out = out.replace(/`(.+?)`/g, '<code>$1</code>');
  return out;
}

// AIの返答(Markdown想定)を見出し・箇条書き・区切り線・段落に分けてHTML化
function renderResultText(text){
  const lines = text.split('\n').map(l => l.trim());
  let html = '';
  let listBuffer = [];

  const flushList = () => {
    if(listBuffer.length){
      html += '<ul style="margin:0 0 9px 18px;padding:0">' +
        listBuffer.map(li => `<li style="margin-bottom:4px">${renderInline(li)}</li>`).join('') +
        '</ul>';
      listBuffer = [];
    }
  };

  lines.forEach(line => {
    if(line === ''){
      flushList();
      return;
    }
    if(/^-{3,}$/.test(line)){
      flushList();
      html += '<div style="border-top:1px solid #2a2a4a;margin:12px 0"></div>';
      return;
    }
    const headingMatch = line.match(/^#{1,3}\s*(.+)$/);
    if(headingMatch){
      flushList();
      html += `<div class="sec-h">${renderInline(headingMatch[1])}</div>`;
      return;
    }
    const listMatch = line.match(/^[-・]\s+(.+)$/);
    if(listMatch){
      listBuffer.push(listMatch[1]);
      return;
    }
    flushList();
    if(/^(🔮|💞|🍽|🛡)/.test(line)){
      html += `<div class="sec-h">${renderInline(line)}</div>`;
    } else {
      html += `<p>${renderInline(line)}</p>`;
    }
  });
  flushList();
  return html;
}

// userContent(Anthropicのcontent配列)を会話履歴に積み、APIを呼んで結果をチャットログに表示する共通処理
async function sendToJohnny(userContent, userDisplayText){
  conversation.push({ role: 'user', content: userContent });

  const log = document.getElementById('chatLog');

  const userMsg = document.createElement('div');
  userMsg.className = 'msg-user';
  userMsg.textContent = userDisplayText || '（分析リクエスト）';
  log.appendChild(userMsg);

  const typingBubble = document.createElement('div');
  typingBubble.className = 'bubble';
  typingBubble.innerHTML = `<div class="b-avatar">🧠</div><div class="b-body"><div class="typing"><span></span><span></span><span></span></div></div>`;
  log.appendChild(typingBubble);
  typingBubble.scrollIntoView({behavior:'smooth', block:'end'});

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: conversation }),
    });
    const data = await res.json();

    typingBubble.remove();
    const resultBubble = document.createElement('div');
    resultBubble.className = 'bubble';
    if(!res.ok || data.error){
      conversation.pop(); // 失敗したリクエストは履歴から取り除く
      resultBubble.innerHTML = `<div class="b-avatar">⚠️</div><div class="b-body"><p style="color:var(--red)">${escapeHtml(data.error || '分析に失敗しました')}</p></div>`;
    } else {
      conversation.push({ role: 'assistant', content: [{ type: 'text', text: data.result }] });
      resultBubble.innerHTML = `<div class="b-avatar">🧠</div><div class="b-body">${renderResultText(data.result)}</div>`;
      document.getElementById('chatInputRow').style.display = 'flex';
      if(!currentSessionStarted){
        currentSessionStarted = true;
        addHistoryEntry(userDisplayText);
      }
    }
    log.appendChild(resultBubble);
    resultBubble.scrollIntoView({behavior:'smooth', block:'start'});
  } catch (err) {
    conversation.pop();
    typingBubble.remove();
    const errBubble = document.createElement('div');
    errBubble.className = 'bubble';
    errBubble.innerHTML = `<div class="b-avatar">⚠️</div><div class="b-body"><p style="color:var(--red)">通信エラー: ${escapeHtml(err.message)}</p></div>`;
    log.appendChild(errBubble);
  }
}

async function runAnalysis(){
  const note = document.getElementById('textNote').value.trim();
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;

  try {
    const images = [];
    for(const f of uploadedFiles){
      if(f.type.startsWith('image/')){
        images.push({ media_type: f.type, data: await fileToBase64(f) });
      } else if(f.type.startsWith('video/')){
        const frames = await extractVideoFrames(f, 3);
        frames.forEach(data => images.push({ media_type: 'image/jpeg', data }));
      }
    }

    const content = [];
    images.forEach(img => {
      content.push({ type: 'image', source: { type: 'base64', media_type: img.media_type, data: img.data } });
    });
    content.push({
      type: 'text',
      text: note
        ? `プロフィール文章・メモ:\n${note}\n\n上記の画像とテキストから恋愛式学タイプを診断してください。`
        : '上記の画像から恋愛式学タイプを診断してください。',
    });

    const fileSummary = uploadedFiles.length ? `📎 ${uploadedFiles.length}件のファイル` : '';
    const displayText = [fileSummary, note].filter(Boolean).join(' / ') || '（分析リクエスト）';

    await sendToJohnny(content, displayText);
  } finally {
    btn.disabled = false;
  }
}

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;

  const sendBtn = document.getElementById('chatSendBtn');
  sendBtn.disabled = true;
  input.value = '';

  await sendToJohnny([{ type: 'text', text }], text);

  sendBtn.disabled = false;
  input.focus();
}
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.isComposing){
    e.preventDefault();
    sendChatMessage();
  }
});

function resetChat(){
  uploadedFiles = [];
  conversation = [];
  currentSessionStarted = false;
  document.getElementById('textNote').value = '';
  document.getElementById('fileInput').value = '';
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('chatLog').innerHTML = '';
  document.getElementById('chatInput').value = '';
  updateAnalyzeBtn();
  document.querySelector('.main').scrollTo({top: 0, behavior: 'smooth'});
  window.scrollTo({top: 0, behavior: 'smooth'});
}

loadHistory();
renderHistory();
</script>
</body>
</html>
